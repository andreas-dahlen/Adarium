name: Main Branch Validation (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.versioning.outputs.new_version }}

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      # Install workspace dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run Oxlint
      - name: Run Oxlint
        run: pnpm --filter web-react run oxlint

      # Run ESLint
      - name: Run ESLint
        run: pnpm --filter web-react run eslint

      # Run Stylelint
      - name: Run Stylelint
        run: pnpm --filter web-react run stylelint

      # Run Unit Tests
      - name: Run Tests
        run: pnpm --filter web-react run test

      # Build Production Bundle
      - name: Build Production Bundle
        run: pnpm --filter web-react run build

      # Copy single-file build -> Android assets
      - name: Copy web build into Android assets
        if: false
        run: |
          mkdir -p ad-web-launcher/android/app/src/main/assets
          cp ad-web-launcher/web-react/dist/index.html ad-web-launcher/android/app/src/main/assets/index.html

      # Setup Java + Android SDK
      - name: Setup JDK
        if: false
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Build Production Release APK
      - name: Build Release APK
        if: false
        working-directory: ad-web-launcher/android
        run: ./gradlew assembleRelease

      # Determine next production version
      - name: Determine next production version
        id: versioning
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $TAG"

          VERSION=${TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          MINOR=$((MINOR + 1))
          NEW_VERSION="v$MAJOR.$MINOR.0"

          echo "New production version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Create Official Production GitHub Release
      - name: Create Production Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.new_version }}
          name: Production Release ${{ steps.versioning.outputs.new_version }}
          body: |
            Official Production Build.
            Commit: ${{ github.sha }}
          files: ad-web-launcher/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}